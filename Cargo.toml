[package]
name = "yakui-miniquad"
version = "0.4.1"
edition = "2021"
readme = "README.md"
repository = "https://github.com/profan/yakui-miniquad"
description = "A library integrating yakui with miniquad."
license = "MIT"

keywords = ["gamedev", "graphics", "ui"]
categories = ["gui"]

[dependencies]
miniquad = { version = "0.4.8", default-features = false }
yakui-core = { git = "https://github.com/bobdercole/yakui.git", branch = "fix/clipping-viewport-offset" }

[dev-dependencies]
yakui = "0.3.0"
